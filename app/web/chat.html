<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해피 — 긍정 대화방</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/character.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

  <!-- 오프라인 안내 배너 -->
  <div class="offline-banner" id="offlineBanner" role="alert">
    <span>⚠️ 인터넷 연결이 끊겼습니다. 네트워크 상태를 확인해 주세요.</span>
  </div>

  <!-- 토스트 알림 컨테이너 -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- 메인 챗 레이아웃 -->
  <div class="chat-layout" id="chatLayout">

    <!-- 사이드바 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a href="/" class="sidebar-logo-link" aria-label="해피 홈으로">
          <div class="sidebar-logo-icon">
            <div class="happi happi--icon happi--cheerful" role="img" aria-label="해피">
              <svg class="happi__svg" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="36" fill="#FFB830"/>
                <circle cx="38" cy="48" r="5" fill="#1A1040"/>
                <circle cx="62" cy="48" r="5" fill="#1A1040"/>
                <ellipse cx="28" cy="58" rx="8" ry="5" fill="#FF85A2" opacity="0.6"/>
                <ellipse cx="72" cy="58" rx="8" ry="5" fill="#FF85A2" opacity="0.6"/>
                <path d="M 37 62 Q 50 76 63 62" stroke="#1A1040" stroke-width="2.8" stroke-linecap="round" fill="none"/>
              </svg>
            </div>
          </div>
          <span class="sidebar-logo-name">해피</span>
          <span class="sidebar-logo-tag">AI</span>
        </a>
        <button class="btn-sidebar-close" id="sidebarClose" aria-label="사이드바 닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-new">
        <button class="btn-new-chat" id="btnNewChat">
          <svg class="ico-plus" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>새로운 대화</span>
        </button>
      </div>

      <div class="sidebar-scroll">
        <div class="sec-header">
          <span class="sec-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            대화 목록
          </span>
        </div>
        <ul class="chat-list" id="roomList">
          <li class="chat-item is-active" data-id="1">
            <span class="chat-emoji">☀️</span>
            <span class="chat-title">오늘의 대화</span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <span class="user-status-dot"></span>
          <span class="user-name" id="userDisplayName">로그인 필요</span>
        </div>
      </div>
    </aside>

    <!-- 메인 대화 영역 -->
    <main class="chat-main">
      <header class="chat-header">
        <div class="header-left">
          <button class="btn-sidebar-toggle" id="sidebarToggle" aria-label="사이드바 열기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="header-title-wrap">
            <h1 class="chat-current-title" id="chatTitle">오늘의 대화</h1>
            <span class="header-badge">긍정 공감 케어</span>
          </div>
        </div>

        <div class="header-right">
          <button class="btn-auth-top" id="authBtnTop">로그인</button>
        </div>
      </header>

      <!-- 채팅 피드 -->
      <section class="chat-feed" id="chatFeed">
        <div class="welcome-hero" id="welcomeHero">
          <div class="welcome-mascot-wrap">
            <div class="happi happi--md happi--cheerful" role="img" aria-label="해피 마스코트">
              <div class="happi__glow"></div>
              <svg class="happi__svg" viewBox="0 0 100 100" fill="none">
                <radialGradient id="hFaceHeroChat" cx="40%" cy="32%" r="70%">
                  <stop offset="0%" stop-color="#FFE566"/>
                  <stop offset="50%" stop-color="#FFB830"/>
                  <stop offset="100%" stop-color="#CC6600"/>
                </radialGradient>
                <circle cx="50" cy="50" r="36" fill="url(#hFaceHeroChat)"/>
                <ellipse cx="40" cy="37" rx="13" ry="9" fill="#FFFFFF" opacity="0.6"/>
                <circle cx="38" cy="48" r="6" fill="#1A1040"/>
                <circle cx="35.5" cy="45.5" r="2" fill="#FFFFFF"/>
                <circle cx="62" cy="48" r="6" fill="#1A1040"/>
                <circle cx="59.5" cy="45.5" r="2" fill="#FFFFFF"/>
                <ellipse cx="28" cy="58" rx="9" ry="6" fill="#FF85A2" opacity="0.6"/>
                <ellipse cx="72" cy="58" rx="9" ry="6" fill="#FF85A2" opacity="0.6"/>
                <path d="M 37 62 Q 50 76 63 62" stroke="#1A1040" stroke-width="2.8" stroke-linecap="round" fill="none"/>
              </svg>
            </div>
          </div>
          <h2 class="welcome-title">안녕하세요! 저는 <em>해피</em>예요 ☀️</h2>
          <p class="welcome-sub">오늘 하루는 어떠셨나요? 힘들었던 일도, 기쁜 소식도 편하게 이야기해 주세요.</p>

          <div class="quick-chips">
            <button class="chip" data-prompt="오늘 너무 지치고 힘든 하루였어.">💛 오늘 너무 지치고 힘든 하루였어</button>
            <button class="chip" data-prompt="나에게 따뜻한 응원 한마디 해줄래?">✨ 나에게 따뜻한 응원 한마디 해줄래?</button>
            <button class="chip" data-prompt="마음이 불안해서 진정이 잘 안 돼.">🌱 마음이 불안해서 진정이 잘 안 돼</button>
            <button class="chip" data-prompt="오늘 열심히 노력한 나를 칭찬해줘!">☀️ 오늘 노력한 나를 칭찬해줘</button>
          </div>
        </div>
      </section>

      <!-- 인풋독 -->
      <footer class="chat-input-area">
        <form class="input-dock" id="inputDock">
          <div class="input-main-row">
            <textarea
              class="chat-input"
              id="chatInput"
              placeholder="해피에게 따뜻한 이야기를 나눠보세요... (Shift+Enter로 줄바꿈)"
              rows="1"
              maxlength="2000"
            ></textarea>
            <button class="btn-send" id="btnSend" type="submit" aria-label="메시지 전송">
              <svg class="ico-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              <div class="btn-spinner"></div>
            </button>
          </div>
          <div class="input-footer-row">
            <span class="input-hint">Enter로 전송 · Shift+Enter 줄바꿈</span>
            <span class="char-count" id="charCount">0 / 2,000</span>
          </div>
        </form>
      </footer>
    </main>
  </div>

  <!-- 인증 모달 -->
  <div class="auth-modal-overlay" id="authModal">
    <div class="auth-modal-card">
      <button class="auth-modal-close" id="authModalClose" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>

      <div class="auth-card-header">
        <div class="auth-modal-icon">
          <div class="happi happi--sm happi--cheerful">
            <svg class="happi__svg" viewBox="0 0 100 100" fill="none">
              <circle cx="50" cy="50" r="36" fill="#FFB830"/>
              <circle cx="38" cy="48" r="5" fill="#1A1040"/>
              <circle cx="62" cy="48" r="5" fill="#1A1040"/>
              <path d="M 37 62 Q 50 76 63 62" stroke="#1A1040" stroke-width="2.8" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
        </div>
        <h3 class="auth-title" id="authTitle">다시 만나서 반가워요!</h3>
        <p class="auth-desc" id="authDesc">해피와 나눈 소중한 대화를 이어가 보세요.</p>
      </div>

      <div class="auth-tabs" id="authTabs" role="tablist">
        <button class="auth-tab-btn is-active" id="tabLogin" role="tab" type="button">로그인</button>
        <button class="auth-tab-btn" id="tabRegister" role="tab" type="button">회원가입</button>
      </div>

      <form class="auth-form" id="authForm" novalidate>
        <div class="field-group">
          <label class="field-label" for="userName">아이디</label>
          <div class="field-wrap">
            <span class="field-icon">👤</span>
            <input class="field-input" type="text" id="userName" name="username" placeholder="영문, 숫자 3~30자" autocomplete="username" maxlength="30">
          </div>
          <span class="field-error" id="nameError"></span>
        </div>

        <div class="field-group">
          <label class="field-label" for="userPw">비밀번호</label>
          <div class="field-wrap">
            <span class="field-icon">🔒</span>
            <input class="field-input" type="password" id="userPw" name="password" placeholder="8자 이상" autocomplete="current-password" maxlength="128">
            <button class="btn-toggle-pw" id="togglePw" type="button" aria-label="비밀번호 표시">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="field-error" id="pwError"></span>
        </div>

        <button class="btn-auth-submit" id="submitBtn" type="submit">
          <span id="submitLabel">로그인하기</span>
          <div class="btn-spinner"></div>
        </button>
      </form>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/chat.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
