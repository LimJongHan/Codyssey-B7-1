[project]
name = "positive-bot"
version = "0.1.0"
description = "긍정과 공감을 전하는 FastAPI 챗봇"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=3.26.0",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]

[tool.vercel]
entrypoint = "app.main:app"
